[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-team18-analysis"
version = "1.0.0"
description = "Steam negative-review NLP, activity modeling, segmentation, and historical complaint profiles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
steam-reviews = "steam_reviews.cli:main"
steam-data-prep = "steam_data_prep.cli:main"
steam-analysis-readiness = "steam_data_prep.analysis_readiness:main"
steam-genre-features = "steam_data_prep.genre_features:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
